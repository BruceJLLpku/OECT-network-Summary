<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fc">
  <meta name="description" content="从化学结构读懂 OECT 网络设计。原文结构图、配比趋势与电学对照。">
  <title>OECT · 网络设计图谱</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <script src="js/charts.js?v=2" defer></script>
  <script src="js/app.js?v=2" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header">
    <a class="brand" href="#about" aria-label="OECT 网络设计图谱首页"><span class="brand-symbol">OECT<span></span></span><span class="brand-name">网络设计图谱</span></a>
    <nav class="primary-nav" aria-label="主导航"><a href="#about" data-nav="about">结构图谱</a><a href="#all" data-nav="all">全部文献</a></nav>
    <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="sr-only">搜索材料、交联剂或文献</span><input id="search" type="search" placeholder="搜索材料、交联剂…" autocomplete="off"><kbd>Ctrl K</kbd></label>
  </header>
  <main id="main" tabindex="-1">
    <section id="atlas-view" aria-labelledby="atlas-title">
      <div class="atlas-heading"><div><p class="eyebrow">从化学结构出发</p><h1 id="atlas-title">找到你的网络方案<span class="heading-dot">.</span></h1></div><p class="library-count" id="library-count" role="status">加载文献…</p></div>
      <div class="atlas-grid" id="atlas-grid"></div>
    </section>
    <section id="library-view" hidden aria-labelledby="library-title">
      <div class="library-heading"><div><a class="back-link" href="#about">返回图谱</a><h1 id="library-title">全部文献</h1><p id="library-subtitle"></p></div><label class="sort-control">排序<select id="sort"><option value="default">方案顺序</option><option value="newest">年份由近到远</option><option value="oldest">年份由远到近</option></select></label></div>
      <nav class="filter-strip" id="filters" aria-label="筛选设计方案"></nav>
      <details class="category-guide" id="category-guide" hidden><summary>设计要点 <span aria-hidden="true">＋</span></summary><div id="guide-content"></div></details>
      <div class="paper-grid" id="paper-grid"></div>
      <p class="empty-state" id="empty-state" hidden>没有匹配文献。试试材料缩写，或清除筛选。</p>
    </section>
    <p id="load-error" class="empty-state" hidden>文献加载失败。请刷新页面重试。</p>
  </main>
  <footer class="site-footer"><span>结构 → 形貌 → 电学</span><span>原图与数据均可追溯至文献</span><a href="data/papers.json" download>完整数据</a></footer>
  <dialog class="paper-dialog" id="paper-dialog" aria-labelledby="paper-title"><div id="paper-content"></div></dialog>
  <dialog class="image-dialog" id="image-dialog" aria-label="原图放大"><button class="icon-button image-close" data-close-image aria-label="关闭大图">×</button><img id="large-image" alt=""><p id="large-image-caption"></p></dialog>
  <noscript>请启用 JavaScript 查看结构图谱。<a href="data/papers.json">下载完整数据</a></noscript>
</body>
</html>
